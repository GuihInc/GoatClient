name: Build GoatClient Launcher

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Empacotar sem executar a suíte de testes'
        required: false
        type: boolean
        default: false
  push:
    tags: ['launcher-v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Package native launcher
        shell: bash
        run: |
          if [ "${{ inputs.skip_tests }}" != "true" ]; then
            ./gradlew test :launcher:test --no-daemon
          fi
          ./gradlew :launcher:packageLauncher --no-daemon
      - name: Smoke test bundled launcher
        shell: bash
        run: |
          java -jar launcher/build/jpackage-input/goatclient-launcher.jar --self-test
          if [ "$RUNNER_OS" = "Linux" ]; then
            launcher/build/native/GoatClientLauncher/bin/GoatClientLauncher --self-test
          elif [ "$RUNNER_OS" = "macOS" ]; then
            launcher/build/native/GoatClientLauncher.app/Contents/MacOS/GoatClientLauncher --self-test
          fi
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'launcher/build/native/GoatClientLauncher/GoatClientLauncher.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native launcher failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: GoatClientLauncher-${{ matrix.os }}
          path: launcher/build/distributions/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*/*.zip
          --title "GoatClient Launcher ${GITHUB_REF_NAME#launcher-v}"
          --notes "Launcher offline-only para Minecraft 26.3. Baixe o pacote correspondente ao seu sistema e extraia o ZIP."
