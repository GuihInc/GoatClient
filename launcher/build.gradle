import groovy.json.JsonOutput
import java.security.MessageDigest

plugins {
    id 'application'
}

version = '1.0.8'
group = 'dev.goatclient'

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
application { mainClass = 'dev.goatclient.launcher.LauncherMain' }

sourceSets.main.java {
    srcDir '../src/main/java'
    include 'dev/goatclient/auth/**'
    include 'dev/goatclient/launcher/**'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }

def clientJar = rootProject.tasks.named('jar', Jar)
def bundledJar = clientJar.flatMap { it.archiveFile }
def releaseResources = layout.buildDirectory.dir('generated/releases')
tasks.register('bundleRelease') {
    dependsOn clientJar
    inputs.file(bundledJar)
    inputs.property 'minecraft', rootProject.minecraft_version
    inputs.property 'loader', rootProject.loader_version
    inputs.property 'fabricApi', rootProject.fabric_api_version
    inputs.property 'clientVersion', rootProject.mod_version
    outputs.dir(releaseResources)
    def mc = rootProject.minecraft_version.toString()
    def loader = rootProject.loader_version.toString()
    def api = rootProject.fabric_api_version.toString()
    def clientVersion = rootProject.mod_version.toString()
    doLast {
        File output = releaseResources.get().asFile
        output.mkdirs()
        File artifact = bundledJar.get().asFile
        File releases = new File(output, 'releases')
        releases.mkdirs()
        java.nio.file.Files.copy(artifact.toPath(), new File(releases, artifact.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def sha = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        new File(output, 'catalog.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: 1,
            releases: [[id: "goatclient-${clientVersion}-mc${mc}", name: "GoatClient ${clientVersion}",
                minecraft: mc, loader: loader, fabricApi: api,
                client: [url: "resource:/releases/${artifact.name}", sha256: sha]]]
        ]))
    }
}

processResources {
    dependsOn tasks.named('bundleRelease')
    from releaseResources
    from('../src/main/resources/assets/goatclient/textures/gui/logo.png') { into 'brand' }
}

tasks.register('exportCatalog', Sync) {
    dependsOn tasks.named('bundleRelease')
    from(releaseResources)
    into layout.buildDirectory.dir('release')
    filesMatching('catalog.json') {
        filter { line -> line.replace('resource:/releases/', 'releases/') }
    }
}

tasks.register('fatJar', Jar) {
    dependsOn classes
    archiveFileName = 'goatclient-launcher.jar'
    destinationDirectory = layout.buildDirectory.dir('jpackage-input')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}

def platformName = System.getProperty('os.name').toLowerCase().contains('win') ? 'windows' :
        System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux'
def platformArch = System.getProperty('os.arch').toLowerCase().contains('aarch64') ? 'arm64' : 'x64'
def imageDir = layout.buildDirectory.dir('native')
def executableName = platformName == 'windows' ? 'jpackage.exe' : 'jpackage'
def packagingJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
def inputDir = layout.buildDirectory.dir('jpackage-input')
def launcherVersion = project.version.toString()
def launcherMainClass = application.mainClass.get()
def brandIcon = file('../src/main/resources/assets/goatclient/textures/gui/logo.png').absolutePath
def generatedIcons = layout.buildDirectory.dir('generated/native-icons')
def windowsIcon = generatedIcons.map { it.file('goatclient.ico') }
def macIcon = generatedIcons.map { it.file('goatclient.icns') }

tasks.register('generateNativeIcons') {
    inputs.file(brandIcon)
    outputs.files(windowsIcon, macIcon)
    doLast {
        def source = javax.imageio.ImageIO.read(new File(brandIcon))
        if (source == null) throw new GradleException("Não foi possível ler o ícone: ${brandIcon}")
        def png = { int size ->
            def image = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = image.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(source, 0, 0, size, size, null)
            } finally { graphics.dispose() }
            def bytes = new java.io.ByteArrayOutputStream()
            javax.imageio.ImageIO.write(image, 'png', bytes)
            bytes.toByteArray()
        }
        def writeLE = { output, value, count ->
            long number = value as long
            int width = count as int
            for (int index = 0; index < width; index++) output.write((int) ((number >>> (8 * index)) & 0xffL))
        }
        def writeBE = { output, value, count ->
            long number = value as long
            int width = count as int
            for (int index = width - 1; index >= 0; index--) output.write((int) ((number >>> (8 * index)) & 0xffL))
        }

        def icoSizes = [16, 24, 32, 48, 64, 128, 256]
        def icoImages = icoSizes.collect { size -> [size: size, bytes: png(size)] }
        def ico = new java.io.ByteArrayOutputStream()
        writeLE(ico, 0, 2) // reserved
        writeLE(ico, 1, 2) // icon resource
        writeLE(ico, icoImages.size(), 2)
        long offset = 6 + 16 * icoImages.size()
        icoImages.each { entry ->
            int size = entry['size'] as int
            writeLE(ico, size == 256 ? 0 : size, 1)
            writeLE(ico, size == 256 ? 0 : size, 1)
            writeLE(ico, 0, 1) // palette
            writeLE(ico, 0, 1) // reserved
            writeLE(ico, 1, 2) // color planes
            writeLE(ico, 32, 2) // bits per pixel
            writeLE(ico, entry['bytes'].length, 4)
            writeLE(ico, offset, 4)
            offset += entry['bytes'].length
        }
        icoImages.each { ico.write(it['bytes']) }
        def icoFile = windowsIcon.get().asFile
        icoFile.parentFile.mkdirs()
        icoFile.bytes = ico.toByteArray()

        def icnsEntries = [[16, 'icp4'], [32, 'icp5'], [64, 'icp6'], [128, 'ic07'],
                           [256, 'ic08'], [512, 'ic09'], [1024, 'ic10']].collect { size, type ->
            def bytes = png(size as int)
            def chunk = new java.io.ByteArrayOutputStream()
            chunk.write(type.getBytes(java.nio.charset.StandardCharsets.US_ASCII))
            writeBE(chunk, bytes.length + 8, 4)
            chunk.write(bytes)
            [bytes: chunk.toByteArray()]
        }
        def icns = new java.io.ByteArrayOutputStream()
        icns.write('icns'.getBytes(java.nio.charset.StandardCharsets.US_ASCII))
        long icnsLength = 8 + icnsEntries.sum { it['bytes'].length }
        writeBE(icns, icnsLength, 4)
        icnsEntries.each { icns.write(it['bytes']) }
        def icnsFile = macIcon.get().asFile
        icnsFile.parentFile.mkdirs()
        icnsFile.bytes = icns.toByteArray()
    }
}

tasks.register('cleanNativeImage', Delete) {
    delete imageDir.map { it.dir('GoatClientLauncher') }
    delete imageDir.map { it.dir('GoatClientLauncher.app') }
}

tasks.register('nativeImage', Exec) {
    dependsOn tasks.named('fatJar'), tasks.named('cleanNativeImage'), tasks.named('generateNativeIcons')
    inputs.file(tasks.named('fatJar').flatMap { it.archiveFile })
    outputs.dir(imageDir)
    def command = [packagingJava.get().metadata.installationPath.file("bin/${executableName}").asFile.absolutePath,
            '--type', 'app-image', '--name', 'GoatClientLauncher',
            '--input', inputDir.get().asFile.absolutePath,
            '--main-jar', 'goatclient-launcher.jar', '--main-class', launcherMainClass,
            '--dest', imageDir.get().asFile.absolutePath, '--app-version', launcherVersion,
            '--vendor', 'GoatClient', '--description', 'GoatClient Launcher',
            '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.charsets,jdk.zipfs,jdk.net']
    def platformIcon = platformName == 'windows' ? windowsIcon.get().asFile.absolutePath :
            platformName == 'macos' ? macIcon.get().asFile.absolutePath : brandIcon
    command += ['--icon', platformIcon]
    commandLine command
}

tasks.register('packageLauncher', Zip) {
    dependsOn tasks.named('nativeImage')
    archiveFileName = "GoatClientLauncher-${project.version}-${platformName}-${platformArch}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(imageDir) { include 'GoatClientLauncher/**', 'GoatClientLauncher.app/**' }
    from('README.md') { rename { 'LEIA-ME.md' } }
    // Native launchers need their executable flags preserved on Unix.
    filePermissions { unix('755') }
}
